<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <title>Turn the Cup — finish your coffee, then read the bottom</title>
    <meta
      name="description"
      content="Finish your coffee. Turn the cup. Read the prediction the grounds left on the bottom. 2,350+ hand-edited readings, 18 collectible cups, streaks and friends. Free on iPhone and iPad."
    />
    <link rel="canonical" href="https://igorishchenko.github.io/morning_whisper_support/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Twitter. Absolute URLs — unfurlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turn the Cup" />
    <meta property="og:title" content="Turn the Cup — finish your coffee, then read the bottom" />
    <meta
      property="og:description"
      content="Finish your coffee. Turn the cup. Read what the grounds left on the bottom. A daily reading, 18 collectible cups, and a streak worth keeping. Free on iPhone and iPad."
    />
    <meta property="og:url" content="https://igorishchenko.github.io/morning_whisper_support/" />
    <!-- The app icon. A dedicated 1200x630 card would unfurl larger; until one
         exists this is a real file rather than a broken reference. -->
    <meta property="og:image" content="https://igorishchenko.github.io/morning_whisper_support/favicon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Turn the Cup app icon — a coffee cup seen from above." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Turn the Cup — finish your coffee, then read the bottom" />
    <meta
      name="twitter:description"
      content="Finish your coffee. Turn the cup. Read what the grounds left on the bottom. Free on iPhone and iPad."
    />
    <meta name="twitter:image" content="https://igorishchenko.github.io/morning_whisper_support/favicon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FDF3E8" />
    <meta name="apple-mobile-web-app-title" content="Turn the Cup" />

    <!-- Open the font connection while the bundle is still parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Static copy of the landing page's structured data, for crawlers that do
         not execute JS. useDocumentMeta injects the per-route version on top. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Turn the Cup",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "iOS",
        "description": "Finish your coffee. Turn the cup. Read the prediction the grounds left on the bottom. 2,350+ hand-edited readings, 18 collectible cups, streaks and friends.",
        "url": "https://igorishchenko.github.io/morning_whisper_support/",
        "image": "https://igorishchenko.github.io/morning_whisper_support/favicon.png",
        "inLanguage": ["en", "es", "fr", "uk"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Second half of the spa-github-pages trick. public/404.html rewrites
      // /privacy to /?/privacy so GitHub Pages serves this file; this turns it
      // back into a real path before React Router mounts. Without it, every
      // deep link — including the privacy policy URL in the store listings —
      // silently lands on the home page.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
